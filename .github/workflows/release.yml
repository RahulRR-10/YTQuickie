name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "release\ffmpeg" | Out-Null
          Copy-Item (Join-Path $ffmpeg.DirectoryName "ffmpeg.exe") "release\ffmpeg\ffmpeg.exe"
          Copy-Item (Join-Path $ffmpeg.DirectoryName "ffprobe.exe") "release\ffmpeg\ffprobe.exe"
          Get-ChildItem release\ffmpeg | Select-Object Name, Length

      - name: Build with PyInstaller
        run: pyinstaller backend\YTQuickie.spec --noconfirm

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\YTQuickie -DestinationPath YTQuickie-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTQuickie-windows-x64
          path: YTQuickie-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YTQuickie-windows-x64.zip
          generate_release_notes: true